name: 技术热榜每日推送

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install

      - name: 运行推送
        env:
          SCT_SENDKEY: ${{ secrets.SCT_SENDKEY }}
          TRENDING_LIMIT: ${{ vars.TRENDING_LIMIT || '10' }}
          GITHUB_RSS_URL: ${{ vars.GITHUB_RSS_URL || 'https://mshibanami.github.io/GitHubTrendingRSS/daily/all.xml' }}
        run: npm start
